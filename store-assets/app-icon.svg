<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4"/>
      <stop offset="100%" style="stop-color:#106EBE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50E6FF"/>
      <stop offset="100%" style="stop-color:#00A8E8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="280" height="280" rx="55" ry="55" fill="url(#bg)"/>

  <!-- Subtle inner shine -->
  <rect x="10" y="10" width="280" height="140" rx="55" ry="55" fill="rgba(255,255,255,0.06)"/>
  <clipPath id="bgClip">
    <rect x="10" y="10" width="280" height="280" rx="55" ry="55"/>
  </clipPath>

  <!-- Keyboard base shape -->
  <g transform="translate(150,155)" filter="url(#shadow)">
    <rect x="-80" y="-38" width="160" height="76" rx="12" ry="12" fill="#1A1A2E" opacity="0.85"/>
  </g>

  <!-- Keyboard key row 1 -->
  <g transform="translate(150,150)">
    <!-- Row 1: ESC-like top row -->
    <rect x="-65" y="-28" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-38" y="-28" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-11" y="-28" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="16" y="-28" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="43" y="-28" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>

    <!-- Row 2 -->
    <rect x="-65" y="-6" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-38" y="-6" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-11" y="-6" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="16" y="-6" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="43" y="-6" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>

    <!-- Row 3 -->
    <rect x="-65" y="16" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-38" y="16" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="-11" y="16" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="16" y="16" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>
    <rect x="43" y="16" width="22" height="18" rx="4" ry="4" fill="#2D2D44"/>

    <!-- Space bar -->
    <rect x="-38" y="40" width="76" height="8" rx="4" ry="4" fill="#3D3D55"/>
  </g>

  <!-- Globe icon above keyboard -->
  <g transform="translate(150,68)" filter="url(#innerGlow)">
    <!-- Globe ring -->
    <ellipse cx="0" cy="0" rx="28" ry="28" fill="none" stroke="url(#accent)" stroke-width="3.5"/>
    <ellipse cx="0" cy="0" rx="16" ry="28" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <!-- Horizontal lines (latitude) -->
    <line x1="-24" y1="-14" x2="24" y2="-14" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
    <line x1="-27" y1="0" x2="27" y2="0" stroke="url(#accent)" stroke-width="1.5" opacity="0.8"/>
    <line x1="-24" y1="14" x2="24" y2="14" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- "L" letter on a key -->
  <g transform="translate(150,212)">
    <rect x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="middle">L</text>
  </g>

  <!-- "K" letter on a key -->
  <g transform="translate(190,212)">
    <rect x="-16" y="-16" width="32" height="32" rx="6" ry="6" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="0" y="5" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1A1A2E" text-anchor="middle" dominant-baseline="middle">K</text>
  </g>

  <!-- Arrow indicator (auto-switching) -->
  <g transform="translate(150,72)" opacity="0.9">
    <path d="M0,50 L0,78 M-6,72 L0,82 L6,72" stroke="url(#accent)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
